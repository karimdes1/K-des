<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Designs | K-DES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="icon" type="image/svg+xml" href="icon/light-logo.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="icon/dark-logo.svg" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --gradient-1: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            --shadow-glow: 0 0 40px rgba(56, 189, 248, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; overflow-x: hidden; line-height: 1.6;
        }
        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles::before {
            content: ''; position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
            border-radius: 50%; top: -10%; left: -5%;
            animation: float 20s ease-in-out infinite;
        }
        .bg-particles::after {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
            border-radius: 50%; bottom: -10%; right: -5%;
            animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        main { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 40px 24px 60px; }
        header { margin-bottom: 40px; animation: fadeInDown 0.8s ease-out; }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand { display: flex; align-items: center; gap: 20px; width: 100%; }
        .avatar-wrapper { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
        .avatar-wrapper::before {
            content: ''; position: absolute; inset: -2px; border-radius: 50%;
            background: var(--gradient-1); opacity: 0.5;
            animation: pulse-ring 3s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.25; }
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--border); position: relative; z-index: 1;
        }
        .title-group { flex: 1; min-width: 0; }
        .title-group .brand-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
        }
        .title-group h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.1;
        }
        .social-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .social-btn, .lang-btn, .back-btn {
            width: 42px; height: 42px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-secondary);
            text-decoration: none; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .social-btn:hover, .lang-btn:hover, .back-btn:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            color: var(--text-primary);
            box-shadow: var(--shadow-glow);
        }
        .back-btn { color: #fb7185; font-weight: 700; font-size: 1.1rem; }
        .back-btn:hover { color: #f43f5e; }
        .social-btn.whatsapp:hover { color: #22c55e; }
        .social-btn.telegram:hover { color: #38bdf8; }
        .lang-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600; font-size: 0.8rem; width: auto; padding: 0 14px;
        }
        .gallery-section { animation: fadeInUp 0.8s ease-out 0.2s both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section-header { margin-bottom: 32px; }
        .section-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem; font-weight: 600;
            display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
        }
        .section-header h2::before {
            content: ''; display: inline-block; width: 4px; height: 24px;
            background: var(--gradient-1); border-radius: 2px;
        }
        .section-header p { color: var(--text-secondary); font-size: 1rem; line-height: 1.7; max-width: 700px; }
        .poster-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-bottom: 40px;
        }
        .poster-tile {
            position: relative; border-radius: 20px; overflow: hidden;
            background: var(--bg-card); border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; transform: translateY(30px);
        }
        .poster-tile.visible { opacity: 1; transform: translateY(0); }
        .poster-tile:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(56, 189, 248, 0.08);
        }
        .poster-tile img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; user-select: none; -webkit-user-drag: none; display: block;
        }
        .poster-tile:hover img { transform: scale(1.1); }
        .poster-tile::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, transparent 50%, rgba(10, 14, 23, 0.7) 100%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .poster-tile:hover::after { opacity: 1; }
        .poster-tile .tile-number {
            position: absolute; bottom: 16px; left: 16px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem; font-weight: 600;
            color: var(--text-primary);
            opacity: 0; transform: translateY(10px);
            transition: all 0.3s ease; z-index: 2;
        }
        .poster-tile:hover .tile-number { opacity: 1; transform: translateY(0); }
        .poster-tile .tile-icon {
            position: absolute; top: 16px; right: 16px;
            width: 36px; height: 36px; border-radius: 10px;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            opacity: 0; transform: scale(0.8);
            transition: all 0.3s ease; z-index: 2;
        }
        .poster-tile:hover .tile-icon { opacity: 1; transform: scale(1); }

        .poster-tile.new-upload::before {
            content: 'NEW';
            position: absolute; top: 12px; left: 12px;
            background: var(--gradient-1); color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            padding: 3px 8px; border-radius: 6px; z-index: 3;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
        }

        .order-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 32px; background: var(--gradient-1);
            color: white; font-weight: 600; font-size: 1rem;
            border-radius: 12px; text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        .order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }
        .order-btn i { font-size: 1.2rem; }

        .lb-backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            z-index: 1000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .lb-backdrop.active { opacity: 1; pointer-events: all; }
        .lb-container {
            position: fixed; inset: 0; z-index: 1001;
            display: flex; align-items: center; justify-content: center;
            padding: 40px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .lb-container.active { opacity: 1; pointer-events: all; }
        .lb-card {
            position: relative; max-width: 85vw; max-height: 85vh;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lb-container.active .lb-card { transform: scale(1); }
        .lb-img-wrapper {
            position: relative; display: flex; align-items: center; justify-content: center;
            background: var(--bg-primary); max-width: 85vw; max-height: 75vh;
            min-width: 280px; min-height: 200px;
        }
        .lb-img {
            max-width: 85vw; max-height: 75vh; width: auto; height: auto;
            object-fit: contain; display: block;
            pointer-events: none; user-select: none; -webkit-user-drag: none;
        }
        .lb-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }
        .lb-name { font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        .lb-nav { display: flex; gap: 8px; }
        .lb-btn {
            width: 36px; height: 36px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-secondary); display: inline-flex;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; font-size: 1rem;
        }
        .lb-btn:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
            border-color: var(--border-hover);
        }
        footer {
            margin-top: 48px; padding-top: 32px;
            border-top: 1px solid var(--border); text-align: center;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        footer p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
        footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
        footer a:hover { opacity: 0.8; }
        .scroll-indicator {
            position: fixed; top: 0; left: 0; right: 0; height: 3px;
            background: var(--gradient-1); transform-origin: left; transform: scaleX(0); z-index: 100;
        }
        @media (max-width: 768px) {
            main { padding: 24px 16px 40px; }
            .brand { flex-wrap: wrap; }
            .social-actions { width: 100%; justify-content: flex-end; margin-top: 8px; margin-left: 0; }
            .poster-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .lb-container { padding: 16px; }
            .lb-img-wrapper, .lb-img { max-width: 92vw; max-height: 80vh; }
        }
        [dir="rtl"] .social-actions { margin-left: 0; margin-right: auto; }
    </style>
</head>
<body>
    <div class="scroll-indicator" id="scrollProgress"></div>
    <div class="bg-particles"></div>
    <div class="grid-overlay"></div>

    <main>
        <header>
            <div class="brand">
                <div class="avatar-wrapper">
                    <img class="avatar" src="logo.avif" alt="K-DES logo" loading="lazy" />
                </div>
                <div class="title-group">
                    <p class="brand-label" id="brandLabel">Karim Designer</p>
                    <h1 id="pageTitle">Poster Designs</h1>
                </div>
                <div class="social-actions">
                    <a class="social-btn whatsapp" href="https://wa.me/963937225412" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                        <i class="bi bi-whatsapp"></i>
                    </a>
                    <a class="social-btn telegram" href="https://t.me/Karim_Des1" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                        <i class="bi bi-telegram"></i>
                    </a>
                    <a class="back-btn" href="index.html" target="_self" aria-label="Back">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <button class="lang-btn" id="langSwitch" type="button">
                        <span>AR</span>
                    </button>
                </div>
            </div>
        </header>

        <section class="gallery-section" aria-label="Poster gallery">
            <div class="section-header">
                <h2 id="sectionTitle">Poster Collection</h2>
                <p id="galleryIntro">Eye-catching poster designs crafted for maximum visual impact. Perfect for events, promotions, advertising, and social media campaigns.</p>
            </div>
            <div class="poster-grid" id="posterGrid"></div>
        </section>

        <div style="text-align: center;">
            <a class="order-btn" id="orderBtn" href="https://wa.me/963937225412?text=مرحبا,%20اريد%20طلب%20منشور%20" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-whatsapp"></i>
                <span id="orderBtnText">Order by WhatsApp</span>
            </a>
        </div>

        <footer>
            <p id="footerText">More designs coming soon</p>
            <p><a href="https://wa.me/963937225412" target="_blank" rel="noopener" id="footerLink">Developed By Karim</a></p>
        </footer>
    </main>

    <div class="lb-backdrop" id="lbBackdrop"></div>
    <div class="lb-container" id="lbContainer">
        <div class="lb-card">
            <div class="lb-img-wrapper">
                <img id="lbImg" class="lb-img" alt="Poster preview" />
            </div>
            <div class="lb-bar">
                <span id="lbName" class="lb-name"></span>
                <div class="lb-nav">
                    <button class="lb-btn" id="lbPrev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
                    <button class="lb-btn" id="lbNext" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
                    <button class="lb-btn" id="lbClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "kdesLanguage";
        const langSwitch = document.getElementById("langSwitch");
        const scrollProgress = document.getElementById("scrollProgress");

        const STATIC_POSTERS = [
            "posters/1.jpeg", "posters/2.jpeg", "posters/3.jpeg", "posters/4.avif",
            "posters/5.avif", "posters/6.avif", "posters/7.avif", "posters/8.jpg",
            "posters/9.jpg", "posters/10.jpg", "posters/11.jpg", "posters/12.jpg",
            "posters/13.avif", "posters/14.avif", "posters/15.avif", "posters/16.avif",
            "posters/17.jpg", "posters/prdlst.jpg"
        ];

        let posterFiles = [...STATIC_POSTERS];
        let currentIndex = 0;

        const layoutPattern = ['normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal','normal'];

        const lbBackdrop = document.getElementById("lbBackdrop");
        const lbContainer = document.getElementById("lbContainer");
        const lbImg = document.getElementById("lbImg");
        const lbName = document.getElementById("lbName");
        const lbClose = document.getElementById("lbClose");
        const lbPrev = document.getElementById("lbPrev");
        const lbNext = document.getElementById("lbNext");

        const translations = {
            en: {
                brand: "Karim Designer", title: "Poster Designs",
                section: "Poster Collection",
                intro: "Eye-catching poster designs crafted for maximum visual impact. Perfect for events, promotions, advertising, and social media campaigns.",
                orderButton: "Order by WhatsApp",
                footer: "More designs coming soon", footerLink: "Developed By Karim"
            },
            ar: {
                brand: "المصمم كريم", title: "تصاميم المناشير",
                section: "مجموعة المناشير",
                intro: "تصاميم مناشير جذابة مصممة لأقصى تأثير بصري. مثالية للفعاليات، الترويج، الإعلان، وحملات وسائل التواصل الاجتماعي.",
                orderButton: "لطلب عبر واتساب",
                footer: "المزيد من التصاميم قادمة قريباً", footerLink: "تطوير: كريم"
            }
        };

        function getStoredLanguage() {
            return localStorage.getItem(STORAGE_KEY) === "ar" ? "ar" : "en";
        }

        function setLanguage(lang) {
            localStorage.setItem(STORAGE_KEY, lang);
            document.documentElement.lang = lang === "ar" ? "ar" : "en";
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            const t = translations[lang];
            document.getElementById("brandLabel").textContent = t.brand;
            document.getElementById("pageTitle").textContent = t.title;
            document.getElementById("sectionTitle").textContent = t.section;
            document.getElementById("galleryIntro").textContent = t.intro;
            document.getElementById("orderBtnText").textContent = t.orderButton;
            document.getElementById("footerText").textContent = t.footer;
            document.getElementById("footerLink").textContent = t.footerLink;
            langSwitch.querySelector("span").textContent = lang === "ar" ? "EN" : "AR";
        }

        function renderPosters() {
            const grid = document.getElementById("posterGrid");
            grid.innerHTML = "";

            posterFiles.forEach((src, index) => {
                const tile = document.createElement("figure");
                tile.className = "poster-tile";
                if (index >= STATIC_POSTERS.length) tile.classList.add("new-upload");

                const layout = layoutPattern[index % layoutPattern.length];
                if (layout === 'wide') tile.classList.add('wide');
                if (layout === 'tall') tile.classList.add('tall');

                tile.dataset.index = index;

                const img = document.createElement("img");
                img.src = src;
                img.alt = `Poster ${index + 1}`;
                img.loading = "lazy";

                const number = document.createElement("span");
                number.className = "tile-number";
                number.textContent = `#${index + 1}`;

                const icon = document.createElement("div");
                icon.className = "tile-icon";
                icon.innerHTML = '<i class="bi bi-arrows-fullscreen"></i>';

                tile.appendChild(img);
                tile.appendChild(number);
                tile.appendChild(icon);

                tile.addEventListener("click", () => openLightbox(index));
                grid.appendChild(tile);

                setTimeout(() => tile.classList.add("visible"), index * 60);
            });
        }

async function loadDynamicImages() {
    try {
        const res = await fetch("/api/list");
        if (!res.ok) return;
        const data = await res.json();
        const items = data.packages || [];

        // With fixed names, there can only be ONE logo and ONE banner
        const logoItem = items.find(it => it.subtype === "logo");
        const bannerItem = items.find(it => it.subtype === "banner");

        if (logoItem && bannerItem) {
            // Replace static packages list with the dynamic one
            // (since fixed names mean there's only one current package)
            packagePairs = [
                ...STATIC_PACKAGES,
                { l: logoItem.url, b: bannerItem.url }
            ];
            renderPackages();
        }
    } catch (err) {
        console.warn("Could not load dynamic package:", err);
    }
}
        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lbBackdrop.classList.add("active");
            lbContainer.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lbBackdrop.classList.remove("active");
            lbContainer.classList.remove("active");
            document.body.style.overflow = "";
            setTimeout(() => { lbImg.src = ""; }, 300);
        }

        function updateLightbox() {
            lbImg.src = posterFiles[currentIndex];
            lbName.textContent = `Poster #${currentIndex + 1}`;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % posterFiles.length;
            updateLightbox();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + posterFiles.length) % posterFiles.length;
            updateLightbox();
        }

        lbClose.addEventListener("click", closeLightbox);
        lbNext.addEventListener("click", (e) => { e.stopPropagation(); nextImage(); });
        lbPrev.addEventListener("click", (e) => { e.stopPropagation(); prevImage(); });
        lbBackdrop.addEventListener("click", closeLightbox);
        lbContainer.addEventListener("click", (e) => {
            if (e.target === lbContainer) closeLightbox();
        });

        document.addEventListener("keydown", (e) => {
            if (!lbContainer.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowRight") nextImage();
            if (e.key === "ArrowLeft") prevImage();
        });

        window.addEventListener("scroll", () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            scrollProgress.style.transform = `scaleX(${scrollTop / scrollHeight})`;
        });

        langSwitch.addEventListener("click", () => {
            const current = document.documentElement.lang === "ar" ? "ar" : "en";
            setLanguage(current === "ar" ? "en" : "ar");
        });

        renderPosters();
        setLanguage(getStoredLanguage());
        loadDynamicImages();

        (function() {
            document.addEventListener("contextmenu", function(e) {
                if (e.target.tagName === "IMG" || e.target.closest(".poster-tile") || e.target.closest(".lb-img-wrapper")) {
                    e.preventDefault();
                }
            });
            document.addEventListener("dragstart", function(e) {
                if (e.target.tagName === "IMG") e.preventDefault();
            });
            document.addEventListener("keydown", function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) e.preventDefault();
                if ((e.ctrlKey || e.metaKey) && e.key === "u") e.preventDefault();
            });
        })();
    </script>
</body>
</html>

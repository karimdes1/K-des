<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brand Packages | K-DES</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="icon" type="image/svg+xml" href="icon/light-logo.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="icon/dark-logo.svg" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            color-scheme: dark;
            --bg-primary: #0a0e17;
            --bg-secondary: #111827;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.06);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --border: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.15);
            --gradient-1: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            --shadow-glow: 0 0 40px rgba(56, 189, 248, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-primary); color: var(--text-primary);
            min-height: 100vh; overflow-x: hidden; line-height: 1.6;
        }
        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
        .bg-particles::before {
            content: ''; position: absolute; width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.06) 0%, transparent 70%);
            border-radius: 50%; top: -10%; left: -5%;
            animation: float 20s ease-in-out infinite;
        }
        .bg-particles::after {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.05) 0%, transparent 70%);
            border-radius: 50%; bottom: -10%; right: -5%;
            animation: float 25s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }
        .grid-overlay {
            position: fixed; inset: 0; pointer-events: none; z-index: 1;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }
        main { position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 40px 24px 60px; }
        header { margin-bottom: 40px; animation: fadeInDown 0.8s ease-out; }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand { display: flex; align-items: center; gap: 20px; width: 100%; }
        .avatar-wrapper { position: relative; width: 56px; height: 56px; flex-shrink: 0; }
        .avatar-wrapper::before {
            content: ''; position: absolute; inset: -2px; border-radius: 50%;
            background: var(--gradient-1); opacity: 0.5;
            animation: pulse-ring 3s ease-in-out infinite;
        }
        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.05); opacity: 0.25; }
        }
        .avatar {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid var(--border); position: relative; z-index: 1;
        }
        .title-group { flex: 1; min-width: 0; }
        .title-group .brand-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem; font-weight: 600; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--accent); margin-bottom: 4px;
        }
        .title-group h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.8rem, 4vw, 2.5rem); font-weight: 700; line-height: 1.1;
        }
        .social-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
        .social-btn, .lang-btn, .back-btn {
            width: 42px; height: 42px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-secondary);
            text-decoration: none; font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .social-btn:hover, .lang-btn:hover, .back-btn:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            color: var(--text-primary);
            box-shadow: var(--shadow-glow);
        }
        .back-btn { color: #fb7185; font-weight: 700; font-size: 1.1rem; }
        .back-btn:hover { color: #f43f5e; }
        .social-btn.whatsapp:hover { color: #22c55e; }
        .social-btn.telegram:hover { color: #38bdf8; }
        .lang-btn {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600; font-size: 0.8rem; width: auto; padding: 0 14px;
        }
        .gallery-section { animation: fadeInUp 0.8s ease-out 0.2s both; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .section-header { margin-bottom: 32px; }
        .section-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.5rem; font-weight: 600;
            display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
        }
        .section-header h2::before {
            content: ''; display: inline-block; width: 4px; height: 24px;
            background: var(--gradient-1); border-radius: 2px;
        }
        .section-header p { color: var(--text-secondary); font-size: 1rem; line-height: 1.7; max-width: 700px; }

        .package-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 24px; margin-bottom: 40px;
        }
        .package-pair {
            display: grid; grid-template-columns: 1fr 1.78fr;
            gap: 12px; border-radius: 20px; overflow: hidden;
            background: var(--bg-card); border: 1px solid var(--border);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0; transform: translateY(30px);
            position: relative;
        }
        .package-pair.visible { opacity: 1; transform: translateY(0); }
        .package-pair:hover {
            border-color: var(--border-hover);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 0 0 60px rgba(56, 189, 248, 0.08);
        }
        .package-pair.new-upload::before {
            content: 'NEW';
            position: absolute; top: 12px; left: 12px;
            background: var(--gradient-1); color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 0.1em;
            padding: 3px 8px; border-radius: 6px; z-index: 5;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.4);
            pointer-events: none;
        }
        .package-item {
            position: relative; overflow: hidden;
            cursor: pointer; background: var(--bg-card);
        }
        .package-item img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; user-select: none; -webkit-user-drag: none; display: block;
        }
        .package-item:hover img { transform: scale(1.08); }
        .package-item::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, transparent 60%, rgba(10, 14, 23, 0.6) 100%);
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .package-item:hover::after { opacity: 1; }
        .package-item .item-label {
            position: absolute; bottom: 12px; left: 12px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem; font-weight: 600;
            color: var(--text-primary);
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            padding: 4px 10px; border-radius: 8px;
            opacity: 0; transform: translateY(8px);
            transition: all 0.3s ease; z-index: 2;
        }
        .package-item:hover .item-label { opacity: 1; transform: translateY(0); }
        .package-item .item-expand {
            position: absolute; top: 12px; right: 12px;
            width: 32px; height: 32px; border-radius: 8px;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            color: var(--accent);
            opacity: 0; transform: scale(0.8);
            transition: all 0.3s ease; z-index: 2;
        }
        .package-item:hover .item-expand { opacity: 1; transform: scale(1); }
        .package-item.l-item { aspect-ratio: 1 / 1; }
        .package-item.b-item { aspect-ratio: 16 / 9; }

        .order-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 14px 32px; background: var(--gradient-1);
            color: white; font-weight: 600; font-size: 1rem;
            border-radius: 12px; text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            animation: fadeInUp 0.8s ease-out 0.4s both;
        }
        .order-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4); }
        .order-btn i { font-size: 1.2rem; }

        .lb-backdrop {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px);
            z-index: 1000; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .lb-backdrop.active { opacity: 1; pointer-events: all; }
        .lb-container {
            position: fixed; inset: 0; z-index: 1001;
            display: flex; align-items: center; justify-content: center;
            padding: 40px; opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .lb-container.active { opacity: 1; pointer-events: all; }
        .lb-card {
            position: relative; max-width: 85vw; max-height: 85vh;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 24px; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .lb-container.active .lb-card { transform: scale(1); }
        .lb-img-wrapper {
            position: relative; display: flex; align-items: center; justify-content: center;
            background: var(--bg-primary); max-width: 85vw; max-height: 75vh;
            min-width: 280px; min-height: 200px;
        }
        .lb-img {
            max-width: 85vw; max-height: 75vh; width: auto; height: auto;
            object-fit: contain; display: block;
            pointer-events: none; user-select: none; -webkit-user-drag: none;
        }
        .lb-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px; border-top: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.02);
        }
        .lb-name { font-family: 'Space Grotesk', sans-serif; font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        .lb-nav { display: flex; gap: 8px; }
        .lb-btn {
            width: 36px; height: 36px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-secondary); display: inline-flex;
            align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; font-size: 1rem;
        }
        .lb-btn:hover {
            background: var(--bg-card-hover); color: var(--text-primary);
            border-color: var(--border-hover);
        }
        footer {
            margin-top: 48px; padding-top: 32px;
            border-top: 1px solid var(--border); text-align: center;
            animation: fadeInUp 0.8s ease-out 0.6s both;
        }
        footer p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 8px; }
        footer a { color: var(--accent); text-decoration: none; font-weight: 500; }
        footer a:hover { opacity: 0.8; }
        .scroll-indicator {
            position: fixed; top: 0; left: 0; right: 0; height: 3px;
            background: var(--gradient-1); transform-origin: left; transform: scaleX(0); z-index: 100;
        }
        @media (max-width: 768px) {
            main { padding: 24px 16px 40px; }
            .brand { flex-wrap: wrap; }
            .social-actions { width: 100%; justify-content: flex-end; margin-top: 8px; margin-left: 0; }
            .package-grid { grid-template-columns: 1fr; }
            .package-pair { grid-template-columns: 1fr 1.78fr; }
            .lb-container { padding: 16px; }
            .lb-img-wrapper, .lb-img { max-width: 92vw; max-height: 80vh; }
        }
        [dir="rtl"] .social-actions { margin-left: 0; margin-right: auto; }
    </style>
</head>
<body>
    <div class="scroll-indicator" id="scrollProgress"></div>
    <div class="bg-particles"></div>
    <div class="grid-overlay"></div>

    <main>
        <header>
            <div class="brand">
                <div class="avatar-wrapper">
                    <img class="avatar" src="logo.avif" alt="K-DES logo" loading="lazy" />
                </div>
                <div class="title-group">
                    <p class="brand-label" id="brandLabel">Karim Designer</p>
                    <h1 id="pageTitle">Brand Packages</h1>
                </div>
                <div class="social-actions">
                    <a class="social-btn whatsapp" href="https://wa.me/963937225412" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp">
                        <i class="bi bi-whatsapp"></i>
                    </a>
                    <a class="social-btn telegram" href="https://t.me/Karim_Des1" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
                        <i class="bi bi-telegram"></i>
                    </a>
                    <a class="back-btn" href="index.html" target="_self" aria-label="Back">
                        <i class="bi bi-arrow-left"></i>
                    </a>
                    <button class="lang-btn" id="langSwitch" type="button">
                        <span>AR</span>
                    </button>
                </div>
            </div>
        </header>

        <section class="gallery-section" aria-label="Package gallery">
            <div class="section-header">
                <h2 id="sectionTitle">Package Collection</h2>
                <p id="galleryIntro">Complete branding packages designed to elevate your business presence. Each package includes social media assets, stationery, and brand guidelines.</p>
            </div>
            <div class="package-grid" id="packageGrid"></div>
        </section>

        <div style="text-align: center;">
            <a class="order-btn" id="orderBtn" href="https://wa.me/963937225412?text=مرحبا,%20اريد%20طلب%20بكج%20تصميم" target="_blank" rel="noopener noreferrer">
                <i class="bi bi-whatsapp"></i>
                <span id="orderBtnText">Order by WhatsApp</span>
            </a>
        </div>

        <footer>
            <p id="footerText">More designs coming soon</p>
            <p><a href="https://wa.me/963937225412" target="_blank" rel="noopener" id="footerLink">Developed By Karim</a></p>
        </footer>
    </main>

    <div class="lb-backdrop" id="lbBackdrop"></div>
    <div class="lb-container" id="lbContainer">
        <div class="lb-card">
            <div class="lb-img-wrapper">
                <img id="lbImg" class="lb-img" alt="Package preview" />
            </div>
            <div class="lb-bar">
                <span id="lbName" class="lb-name"></span>
                <div class="lb-nav">
                    <button class="lb-btn" id="lbPrev" aria-label="Previous"><i class="bi bi-chevron-left"></i></button>
                    <button class="lb-btn" id="lbNext" aria-label="Next"><i class="bi bi-chevron-right"></i></button>
                    <button class="lb-btn" id="lbClose" aria-label="Close"><i class="bi bi-x-lg"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = "kdesLanguage";
        const langSwitch = document.getElementById("langSwitch");
        const scrollProgress = document.getElementById("scrollProgress");

        const STATIC_PACKAGES = [
            { l: "newbackgs/L1.jpg",  b: "newbackgs/B1.jpg" },
            { l: "newbackgs/L2.jpg",  b: "newbackgs/B2.jpg" },
            { l: "newbackgs/L3.jpg",  b: "newbackgs/B3.jpg" },
            { l: "newbackgs/L4.jpg",  b: "newbackgs/B4.jpg" },
            { l: "newbackgs/L5.avif", b: "newbackgs/B5.avif" },
            { l: "newbackgs/L6.jpg",  b: "newbackgs/B6.jpg" },
            { l: "newbackgs/L7.jpg",  b: "newbackgs/B7.jpg" },
            { l: "newbackgs/L8.jpg",  b: "newbackgs/B8.jpg" },
            { l: "newbackgs/L9.jpg",  b: "newbackgs/B9.jpg" },
            { l: "newbackgs/L10.jpg", b: "newbackgs/B10.jpg" },
            { l: "newbackgs/L11.jpg", b: "newbackgs/B11.jpg" },
            { l: "newbackgs/L12.avif",b: "newbackgs/B12.avif" },
            { l: "newbackgs/L13.jpg", b: "newbackgs/B13.jpg" },
            { l: "newbackgs/L14.jpg", b: "newbackgs/B14.jpg" },
            { l: "newbackgs/L15.jpg", b: "newbackgs/B15.jpg" }
        ];

        let packagePairs = [...STATIC_PACKAGES];
        let allImages = [];
        let currentIndex = 0;

        const lbBackdrop = document.getElementById("lbBackdrop");
        const lbContainer = document.getElementById("lbContainer");
        const lbImg = document.getElementById("lbImg");
        const lbName = document.getElementById("lbName");
        const lbClose = document.getElementById("lbClose");
        const lbPrev = document.getElementById("lbPrev");
        const lbNext = document.getElementById("lbNext");

        const translations = {
            en: {
                brand: "Karim Designer", title: "Brand Packages",
                section: "Package Collection",
                intro: "Complete branding packages designed to elevate your business presence. Each package includes social media assets, stationery, and brand guidelines.",
                orderButton: "Order by WhatsApp",
                footer: "More designs coming soon", footerLink: "Developed By Karim"
            },
            ar: {
                brand: "المصمم كريم", title: "حزم العلامة التجارية",
                section: "مجموعة الحزم",
                intro: "حزم علامة تجارية كاملة مصممة للارتقاء بوجود عملك. كل حزمة تشمل أصول وسائل التواصل الاجتماعي، القرطاسية، وإرشادات العلامة.",
                orderButton: "لطلب عبر واتساب",
                footer: "المزيد من التصاميم قادمة قريباً", footerLink: "تطوير: كريم"
            }
        };

        function getStoredLanguage() {
            return localStorage.getItem(STORAGE_KEY) === "ar" ? "ar" : "en";
        }

        function setLanguage(lang) {
            localStorage.setItem(STORAGE_KEY, lang);
            document.documentElement.lang = lang === "ar" ? "ar" : "en";
            document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
            const t = translations[lang];
            document.getElementById("brandLabel").textContent = t.brand;
            document.getElementById("pageTitle").textContent = t.title;
            document.getElementById("sectionTitle").textContent = t.section;
            document.getElementById("galleryIntro").textContent = t.intro;
            document.getElementById("orderBtnText").textContent = t.orderButton;
            document.getElementById("footerText").textContent = t.footer;
            document.getElementById("footerLink").textContent = t.footerLink;
            langSwitch.querySelector("span").textContent = lang === "ar" ? "EN" : "AR";
        }

        function renderPackages() {
            const grid = document.getElementById("packageGrid");
            grid.innerHTML = "";
            allImages = [];

            packagePairs.forEach((pair, pairIndex) => {
                const container = document.createElement("div");
                container.className = "package-pair";
                if (pairIndex >= STATIC_PACKAGES.length) container.classList.add("new-upload");

                // L item
                const lItem = document.createElement("div");
                lItem.className = "package-item l-item";
                const lImg = document.createElement("img");
                lImg.src = pair.l;
                lImg.alt = `Package ${pairIndex + 1} - Light`;
                lImg.loading = "lazy";
                lItem.appendChild(lImg);

                const lLabel = document.createElement("span");
                lLabel.className = "item-label";
                lLabel.textContent = `#${pairIndex + 1} L`;
                lItem.appendChild(lLabel);

                const lExpand = document.createElement("div");
                lExpand.className = "item-expand";
                lExpand.innerHTML = '<i class="bi bi-arrows-fullscreen"></i>';
                lItem.appendChild(lExpand);

                lItem.addEventListener("click", () => openLightbox(allImages.indexOf(pair.l)));
                container.appendChild(lItem);
                allImages.push(pair.l);

                // B item
                const bItem = document.createElement("div");
                bItem.className = "package-item b-item";
                const bImg = document.createElement("img");
                bImg.src = pair.b;
                bImg.alt = `Package ${pairIndex + 1} - Banner`;
                bImg.loading = "lazy";
                bItem.appendChild(bImg);

                const bLabel = document.createElement("span");
                bLabel.className = "item-label";
                bLabel.textContent = `#${pairIndex + 1} B`;
                bItem.appendChild(bLabel);

                const bExpand = document.createElement("div");
                bExpand.className = "item-expand";
                bExpand.innerHTML = '<i class="bi bi-arrows-fullscreen"></i>';
                bItem.appendChild(bExpand);

                bItem.addEventListener("click", () => openLightbox(allImages.indexOf(pair.b)));
                container.appendChild(bItem);
                allImages.push(pair.b);

                grid.appendChild(container);

                setTimeout(() => container.classList.add("visible"), pairIndex * 80);
            });
        }

        async function loadDynamicImages() {
            try {
                const res = await fetch("/api/list");
                if (!res.ok) return;
                const data = await res.json();
                const dynamicItems = data.packages || [];

                // Separate by subtype (folder in key)
                const dynLogos = dynamicItems.filter(it => it.key.includes("/logo/")).map(it => it.url);
                const dynBanners = dynamicItems.filter(it => it.key.includes("/banner/")).map(it => it.url);

                // Fallback: if subtype folders missing, pair in upload order
                const logos = dynLogos.length ? dynLogos : dynamicItems.filter((_, i) => i % 2 === 0).map(it => it.url);
                const banners = dynBanners.length ? dynBanners : dynamicItems.filter((_, i) => i % 2 === 1).map(it => it.url);

                const dynPairs = [];
                const maxLen = Math.max(logos.length, banners.length);
                for (let i = 0; i < maxLen; i++) {
                    dynPairs.push({
                        l: logos[i] || banners[i],
                        b: banners[i] || logos[i]
                    });
                }

                if (dynPairs.length > 0) {
                    packagePairs = [...STATIC_PACKAGES, ...dynPairs];
                    renderPackages();
                }
            } catch (err) {
                console.warn("Could not load dynamic packages:", err);
            }
        }

        function openLightbox(index) {
            if (index < 0) return;
            currentIndex = index;
            updateLightbox();
            lbBackdrop.classList.add("active");
            lbContainer.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeLightbox() {
            lbBackdrop.classList.remove("active");
            lbContainer.classList.remove("active");
            document.body.style.overflow = "";
            setTimeout(() => { lbImg.src = ""; }, 300);
        }

        function updateLightbox() {
            const src = allImages[currentIndex];
            lbImg.src = src;
            lbName.textContent = `Package #${Math.floor(currentIndex / 2) + 1} ${currentIndex % 2 === 0 ? 'L' : 'B'}`;
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % allImages.length;
            updateLightbox();
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + allImages.length) % allImages.length;
            updateLightbox();
        }

        lbClose.addEventListener("click", closeLightbox);
        lbNext.addEventListener("click", (e) => { e.stopPropagation(); nextImage(); });
        lbPrev.addEventListener("click", (e) => { e.stopPropagation(); prevImage(); });
        lbBackdrop.addEventListener("click", closeLightbox);
        lbContainer.addEventListener("click", (e) => {
            if (e.target === lbContainer) closeLightbox();
        });

        document.addEventListener("keydown", (e) => {
            if (!lbContainer.classList.contains("active")) return;
            if (e.key === "Escape") closeLightbox();
            if (e.key === "ArrowRight") nextImage();
            if (e.key === "ArrowLeft") prevImage();
        });

        window.addEventListener("scroll", () => {
            const scrollTop = document.documentElement.scrollTop || document.body.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            scrollProgress.style.transform = `scaleX(${scrollTop / scrollHeight})`;
        });

        langSwitch.addEventListener("click", () => {
            const current = document.documentElement.lang === "ar" ? "ar" : "en";
            setLanguage(current === "ar" ? "en" : "ar");
        });

        renderPackages();
        setLanguage(getStoredLanguage());
        loadDynamicImages();

        (function() {
            document.addEventListener("contextmenu", function(e) {
                if (e.target.tagName === "IMG" || e.target.closest(".package-item") || e.target.closest(".lb-img-wrapper")) {
                    e.preventDefault();
                }
            });
            document.addEventListener("dragstart", function(e) {
                if (e.target.tagName === "IMG") e.preventDefault();
            });
            document.addEventListener("keydown", function(e) {
                if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) e.preventDefault();
                if ((e.ctrlKey || e.metaKey) && e.key === "u") e.preventDefault();
            });
        })();
    </script>
</body>
</html>
